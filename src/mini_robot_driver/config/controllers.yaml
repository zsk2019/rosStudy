controller_manager:
  ros__parameters:
    update_rate: 50
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:

    left_wheel_names:
      - left_wheel_joint

    right_wheel_names:
      - right_wheel_joint

    wheel_separation: 0.44

    wheel_radius: 0.05

    odom_frame_id: odom

    base_frame_id: base_link

    enable_odom_tf: true

    position_feedback: true

    open_loop: false

    cmd_vel_timeout: 0.5